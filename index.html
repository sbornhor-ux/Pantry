body{font-family:'DM Sans',sans-serif;background:linear-gradient(160deg,#f5f0eb,#eae4dd,#e8e2d9);color:#333;min-height:100vh;padding-bottom:72px}
h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;color:#1a1a2e}
.container{max-width:600px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0 12px;border-bottom:1px solid #d4c9bc}
header h1{font-size:26px;letter-spacing:-.5px}
header p{font-size:12px;color:#888;margin-top:2px}
main{padding:20px 0;min-height:60vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #e0dbd4;padding-bottom:env(safe-area-inset-bottom);z-index:100}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;border:none;background:0;cursor:pointer;color:#999;font-family:'DM Sans',sans-serif;font-weight:500;font-size:10px}
nav button.active{color:#2d6a4f;font-weight:700}
nav button span.icon{font-size:22px;display:block}
nav button span.lbl{margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:10px;padding:14px 12px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:3px solid #2d6a4f}
.stat.red{border-left-color:#e74c3c}
.stat-label{font-size:10px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.stat-val{font-size:22px;font-weight:700;color:#1a1a2e;margin-top:2px;font-family:'DM Serif Display',Georgia,serif}
.stat.red .stat-val{color:#e74c3c}
.btn{padding:12px 24px;background:#2d6a4f;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 2px 8px rgba(45,106,79,.25)}
.btn-sm{padding:10px 16px;font-size:14px}
.btn-sec{padding:8px 14px;background:#fff;color:#2d6a4f;border:1px solid rgba(45,106,79,.27);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.chips{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.chip{padding:5px 12px;border:1px solid #ccc;border-radius:16px;background:#fff;cursor:pointer;font-size:11px;font-weight:500;font-family:'DM Sans',sans-serif;color:#666;white-space:nowrap}
.chip.on{background:#2d6a4f;color:#fff;border-color:#2d6a4f}
.tbl-wrap{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#fafaf8;border-bottom:1px solid #eee;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#888;cursor:pointer;user-select:none}
td{padding:8px 12px;border-bottom:1px solid #f5f5f3}
.low-bg{background:rgba(231,76,60,.06)}
.low-badge{margin-left:6px;padding:1px 5px;background:rgba(231,76,60,.09);color:#e74c3c;font-size:9px;font-weight:700;border-radius:3px}
.urg{padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600}
.bar-bg{flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden;max-width:80px}
.bar-fill{height:100%;border-radius:3px;transition:width .3s}
.section-hdr{font-family:'DM Serif Display',Georgia,serif;font-size:16px;color:#1a1a2e;padding:8px 0 6px;border-bottom:1px solid #e0dbd4;margin-bottom:6px}
.section-hdr.red{color:#e74c3c}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.list-item.done{opacity:.45;text-decoration:line-through}
.list-item.recipe-bg{background:#f0faf5}
.list-item.restock-bg{background:#fef2f2}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cb.on{background:#2d6a4f;border-color:#2d6a4f;color:#fff;font-size:11px}
.cb.red.on{background:#e74c3c;border-color:#e74c3c}
.badge{font-size:9px;font-weight:700;text-transform:uppercase;color:#2d6a4f}
.meal-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.meal-card{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-top:3px solid #2d6a4f;position:relative}
.meal-card .close{position:absolute;top:8px;right:10px;background:0;border:0;cursor:pointer;font-size:14px;color:#ccc}
.meal-card .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#2d6a4f;margin-bottom:4px}
.meal-card h3{font-size:16px;margin-bottom:2px}
.meal-card .meta{font-size:11px;color:#888}
.recipe-card{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:10px;border-top:3px solid #e0dbd4}
.recipe-card.hl{border-top-color:#2d6a4f}
.recipe-card .top{display:flex;justify-content:space-between;align-items:start}
.recipe-card .close{background:0;border:0;cursor:pointer;font-size:16px;color:#ccc;padding:4px}
.recipe-card .wk{font-size:10px;font-weight:700;color:#2d6a4f;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.recipe-card h3{font-size:18px;cursor:pointer}
.recipe-card .meta{font-size:12px;color:#888;margin-top:2px}
.recipe-card .detail{margin-top:12px}
.recipe-card .detail .lbl{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;margin-bottom:6px}
.recipe-card .pills{display:flex;flex-wrap:wrap;gap:5px}
.recipe-card .pill{padding:3px 8px;background:#f5f0eb;border-radius:5px;font-size:12px;color:#555}
.recipe-card ol{margin:0;padding-left:16px;font-size:13px;color:#555;line-height:1.7}
.update-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:8px}
.update-row .info{flex:1;min-width:0}
.update-row .nm{font-weight:600;font-size:14px;color:#1a1a2e}
.update-row .amt{font-size:11px;color:#999}
.update-row .right{display:flex;align-items:center;gap:10px}
.update-row input{width:60px;text-align:center;font-size:15px;font-weight:700;padding:6px;border:1px solid #ddd;border-radius:8px;font-family:'DM Sans',sans-serif}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:#fff;border-radius:14px;padding:20px 24px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal h3{font-size:20px;margin:0;color:#1a1a2e}
.modal .close{background:0;border:0;font-size:22px;cursor:pointer;color:#999;padding:4px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none}
.field textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cat-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cat-row span{flex:1;font-size:13px}
.cat-row select{width:110px;padding:6px 8px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif}
.hidden{display:none}
.center{text-align:center;padding:50px 0}
.center .big{font-size:48px;margin-bottom:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}

/* ═══ WEDNESDAY AUTO-DECAY ═══ */
function checkWednesdayDecay(){
  var now=new Date();
  if(now.getDay()!==3)return; // 3 = Wednesday
  var lastDecayDate=ld("p_last_decay","");
  var todayStr=now.getFullYear()+"-"+(now.getMonth()+1)+"-"+now.getDate();
  if(lastDecayDate===todayStr)return; // already decayed today
  var changed=false;
  inventory=inventory.map(function(item){
    var ls=item.levels;if(ls.length<2)return item;
    var prev=ls[ls.length-2].level;var cur=ls[ls.length-1].level;
    var d=prev-cur; // weekly decay rate
    if(d<=0)return item; // no decay or increasing
    var projected=Math.max(0,Math.round(cur-d));
    changed=true;
    return Object.assign({},item,{levels:ls.concat([{week:wkStr(),level:projected}])});
  });
  if(changed){sv("p_inv",inventory);sv("p_last_decay",todayStr)}
}
checkWednesdayDecay();

/* ═══ HELPERS ═══ */
var UTH={4:30,3:20,2:10,1:0};
var UL={4:"Critical",3:"High",2:"Medium",1:"Low"};
var UC={4:"#e74c3c",3:"#f39c12",2:"#3498db",1:"#95a5a6"};
function ll(item){return item.levels[item.levels.length-1].level}
function decay(item){var ls=item.levels;if(ls.length<2)return 0;return ls[ls.length-2].level-ls[ls.length-1].level}
function proj(item){return Math.max(0,ll(item)-decay(item))}
function isLow(item){return ll(item)<=UTH[item.urgency]}
function lClr(l){return l<=10?"#e74c3c":l<=25?"#f39c12":l<=50?"#e67e22":"#27ae60"}
function shuf(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t}return b}
function wkStr(){var d=new Date();return(d.getMonth()+1)+"/"+d.getDate()+"/"+String(d.getFullYear()).slice(-2)}
function invMatch(n,inv){var lo=n.toLowerCase();for(var i=0;i<inv.length;i++){var il=inv[i].name.toLowerCase();if(lo.indexOf(il)>=0||il.indexOf(lo)>=0)return inv[i];var words=lo.split(/[\s,()]+/);for(var w=0;w<words.length;w++){if(words[w].length>3&&il.indexOf(words[w])>=0)return inv[i]}}return null}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function $(sel){return document.querySelector(sel)}
function $$(sel){return document.querySelectorAll(sel)}
function dollars(n){var s="";for(var i=0;i<n;i++)s+="$";return s}

function recipeCard(r,hl){
  var idx=-1;for(var i=0;i<recipes.length;i++){if(recipes[i].id===r.id){idx=i;break}}
  var h='<div class="recipe-card'+(hl?" hl":"")+'"><div class="top"><div style="cursor:pointer;flex:1" onclick="toggleRecipe('+r.id+')">';
  if(hl)h+='<div class="wk">★ This Week</div>';
  h+='<h3>'+esc(r.name)+'</h3><div class="meta">'+esc(r.category)+' · '+dollars(r.cost)+' · '+esc(r.time)+'</div></div>';
  h+='<button class="close" onclick="confirmDeleteRecipe('+r.id+',\''+esc(r.name).replace(/'/g,"\\'")+'\')">✕</button></div>';
  if(expandedRecipe===r.id){
    h+='<div class="detail"><div class="lbl">Ingredients</div><div class="pills">';
    r.ingredients.forEach(function(ing){h+='<span class="pill">'+esc(ing.name)+(ing.qty?' ('+esc(ing.qty)+')':'')+'</span>'});
    h+='</div><div class="lbl" style="margin-top:10px">Steps</div><ol>';
    r.steps.forEach(function(s){h+='<li>'+esc(s)+'</li>'});
    h+='</ol>';
    if(!hl&&idx>=0)h+='<button class="btn" style="width:100%;margin-top:12px;font-size:13px;padding:10px" onclick="selectRecipeForWeek('+idx+')">★ Select for This Week</button>';
    h+='</div>';
  }
  h+='</div>';return h;
}

/* ═══ GROCERY LIST ═══ */
function renderGrocery(){
  var m1=recipes[selMeals[0]],m2=recipes[selMeals[1]];
  if(!m1||!m2){main.innerHTML="<p>Select meals first</p>";return}
  var allIng=m1.ingredients.concat(m2.ingredients);
  var seen={};var buckets={meat:[],vegetable:[],starch:[],fruit:[],other:[]};
  allIng.forEach(function(ing){if(seen[ing.name])return;seen[ing.name]=true;
    var m=invMatch(ing.name,inventory);if(m&&ll(m)>50)return;
    var cat=ing.groceryCat||"other";if(!buckets[cat])cat="other";
    buckets[cat].push({text:ing.name+(ing.qty?" — "+ing.qty:""),src:"recipe"});
  });
  function fillFrom(pool,cat,target){var cur=buckets[cat]?buckets[cat].length:0;var need=Math.max(0,target-cur);
    var avail=shuf(pool.filter(function(p){return!seen[p.split("(")[0].trim()]}));
    for(var i=0;i<Math.min(need,avail.length);i++)buckets[cat].push({text:avail[i],src:"pool"})}
  fillFrom(MEAT_POOL,"meat",FILL.meat);fillFrom(VEG_POOL,"vegetable",FILL.vegetable);
  fillFrom(STARCH_POOL,"starch",FILL.starch);fillFrom(FRUIT_POOL,"fruit",FILL.fruit);
  var bk=shuf(BREAKFAST_POOL).slice(0,FILL.breakfast).map(function(p){return{text:p,src:"pool"}});
  var fn=shuf(FUN_POOL).slice(0,FILL.fun).map(function(p){return{text:p,src:"pool"}});
  var sections=[
    {key:"meat",icon:"🥩",title:"Meat / Protein",items:buckets.meat},
    {key:"veg",icon:"🥦",title:"Vegetables",items:buckets.vegetable},
    {key:"starch",icon:"🥔",title:"Starch",items:buckets.starch},
    {key:"fruit",icon:"🍎",title:"Fruits",items:buckets.fruit},
    {key:"bk",icon:"🍳",title:"Breakfast (4-5 days, 2 ppl)",items:bk},
    {key:"fun",icon:"🍫",title:"Fun / Snacks (4-5 days)",items:fn},
    {key:"other",icon:"🍽️",title:"Other Recipe Items",items:buckets.other}
  ];
  var low=inventory.filter(isLow);
  var total=0;sections.forEach(function(s){total+=s.items.length});total+=low.length;
  var ckCount=0;for(var k in checkedItems)if(checkedItems[k])ckCount++;
  var h='<div class="topbar"><div><h2 style="margin:0">Grocery List</h2><p style="color:#888;font-size:12px;margin-top:2px">'+ckCount+'/'+total+' checked</p></div><button class="btn-sec" onclick="rerollMeals()">↻ New Meals</button></div>';
  h+='<div class="meal-cards">';
  [{m:m1,i:0},{m:m2,i:1}].forEach(function(obj){
    h+='<div class="meal-card"><button class="close" onclick="replaceMeal('+obj.i+')">✕</button>';
    h+='<div class="tag">Meal '+(obj.i+1)+'</div><h3>'+esc(obj.m.name)+'</h3>';
    h+='<div class="meta">'+dollars(obj.m.cost)+' · '+esc(obj.m.time)+'</div></div>';
  });
  h+='</div>';
  sections.forEach(function(sec){
    if(sec.items.length===0)return;
    h+='<div class="section-hdr">'+sec.icon+' '+sec.title+'</div>';
    sec.items.forEach(function(item,ii){
      var k=sec.key+"-"+ii;var c=!!checkedItems[k];
      h+='<div class="list-item'+(c?" done":"")+(item.src==="recipe"?" recipe-bg":"")+'" onclick="toggleCheck(\''+k+'\')">';
      h+='<div class="cb'+(c?" on":"")+'">'+( c?"✓":"")+'</div>';
      h+='<span style="flex:1">'+esc(item.text)+'</span>';
      if(item.src==="recipe")h+='<span class="badge">Recipe</span>';
      h+='</div>';
    });
  });
  if(low.length>0){
    h+='<div class="section-hdr red">⚠️ Low Inventory — Restock</div>';
    low.forEach(function(item,i){
      var k="l-"+i;var c=!!checkedItems[k];
      h+='<div class="list-item'+(c?" done":"")+' restock-bg" onclick="toggleCheck(\''+k+'\')">';
      h+='<div class="cb red'+(c?" on":"")+'">'+( c?"✓":"")+'</div>';
      h+='<span style="flex:1">'+esc(item.name)+' ('+esc(item.amount)+')</span>';
      h+='<span style="font-size:12px;font-weight:700;color:#e74c3c">'+ll(item)+'%</span></div>';
    });
  }
  h+='<div style="margin-top:24px;padding-top:16px;border-top:2px solid #d4c9bc">';
  h+='<button class="btn" style="width:100%;font-size:16px;padding:14px" onclick="confirmShopping()">✓ Confirm Shopping Complete</button>';
  h+='<p style="color:#888;font-size:11px;text-align:center;margin-top:8px">Checked items will update your inventory to 100%</p></div>';
  main.innerHTML=h;
}
/* ═══ ACTION HANDLERS ═══ */
function confirmShopping(){
  var overlay=document.createElement("div");overlay.className="overlay";overlay.id="confirm-overlay";
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove()};
  var ckCount=0;for(var k in checkedItems)if(checkedItems[k])ckCount++;
  var h='<div class="modal" style="max-width:340px;text-align:center">';
  h+='<div style="font-size:40px;margin-bottom:8px">🛒</div>';
  h+='<h3 style="margin-bottom:12px">Shopping Done?</h3>';
  h+='<p style="color:#666;font-size:14px;margin-bottom:20px">'+ckCount+' checked items will be marked as fully stocked (100%) in your inventory.</p>';
  h+='<div style="display:flex;gap:10px"><button class="btn-sec" style="flex:1" onclick="document.getElementById(\'confirm-overlay\').remove()">Cancel</button>';
  h+='<button class="btn" style="flex:1" onclick="doConfirmShopping()">Confirm</button></div></div>';
  overlay.innerHTML=h;document.body.appendChild(overlay);
}
function doConfirmShopping(){
  var ws=wkStr();
  // Collect names of all checked grocery items
  var checkedNames=[];
  // We need to rebuild the grocery sections to map keys back to names
  var m1=recipes[selMeals[0]],m2=recipes[selMeals[1]];
  if(m1&&m2){
    var allIng=m1.ingredients.concat(m2.ingredients);
    var seen={};var buckets={meat:[],vegetable:[],starch:[],fruit:[],other:[]};
    allIng.forEach(function(ing){if(seen[ing.name])return;seen[ing.name]=true;
      var m=invMatch(ing.name,inventory);if(m&&ll(m)>50)return;
      var cat=ing.groceryCat||"other";if(!buckets[cat])cat="other";
      buckets[cat].push({text:ing.name,src:"recipe"});
    });
    function fillFrom2(pool,cat,target){var cur=buckets[cat]?buckets[cat].length:0;var need=Math.max(0,target-cur);
      var avail=shuf(pool.filter(function(p){return!seen[p.split("(")[0].trim()]}));
      for(var i=0;i<Math.min(need,avail.length);i++)buckets[cat].push({text:avail[i],src:"pool"})}
    fillFrom2(MEAT_POOL,"meat",FILL.meat);fillFrom2(VEG_POOL,"vegetable",FILL.vegetable);
    fillFrom2(STARCH_POOL,"starch",FILL.starch);fillFrom2(FRUIT_POOL,"fruit",FILL.fruit);
    var sections2=[
      {key:"meat",items:buckets.meat},{key:"veg",items:buckets.vegetable},
      {key:"starch",items:buckets.starch},{key:"fruit",items:buckets.fruit},
      {key:"bk",items:shuf(BREAKFAST_POOL).slice(0,FILL.breakfast).map(function(p){return{text:p}})},
      {key:"fun",items:shuf(FUN_POOL).slice(0,FILL.fun).map(function(p){return{text:p}})},
      {key:"other",items:buckets.other}
    ];
    sections2.forEach(function(sec){sec.items.forEach(function(item,ii){
      var k=sec.key+"-"+ii;
      if(checkedItems[k])checkedNames.push(item.text);
    })});
    // Also collect checked low-inventory items
    var low=inventory.filter(isLow);
    low.forEach(function(item,i){if(checkedItems["l-"+i])checkedNames.push(item.name)});
  }
  // Update inventory: match checked names to inventory items, set to 100%
  inventory=inventory.map(function(item){
    var matched=false;
    for(var i=0;i<checkedNames.length;i++){
      var cn=checkedNames[i].toLowerCase();
      var iname=item.name.toLowerCase();
      if(cn.indexOf(iname)>=0||iname.indexOf(cn)>=0||
        cn.split(/[\s,()]+/).filter(function(w){return w.length>3}).some(function(w){return iname.indexOf(w)>=0})){
        matched=true;break;
      }
    }
    if(matched)return Object.assign({},item,{levels:item.levels.concat([{week:ws,level:100}])});
    return item;
  });
  sv("p_inv",inventory);
  checkedItems={};
  var el=document.getElementById("confirm-overlay");if(el)el.remove();
  // Show success then go to inventory
  curPage="inventory";render();
  // Brief toast
  var toast=document.createElement("div");
  toast.style.cssText="position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#2d6a4f;color:#fff;padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;z-index:2000;box-shadow:0 4px 12px rgba(0,0,0,.2)";
  toast.textContent="Inventory updated!";
  document.body.appendChild(toast);
  setTimeout(function(){toast.remove()},2500);
}
function setFilter(c){invFilter=c;render()}
function toggleSort(c){if(invSort===c)invDir=invDir==="asc"?"desc":"asc";else{invSort=c;invDir="desc"}render()}
function toggleCheck(k){checkedItems[k]=!checkedItems[k];render()}
function toggleRecipe(id){expandedRecipe=expandedRecipe===id?null:id;render()}
function confirmDeleteRecipe(id,name){
  var overlay=document.createElement("div");overlay.className="overlay";overlay.id="confirm-overlay";
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove()};
  var h='<div class="modal" style="max-width:340px;text-align:center">';
  h+='<h3 style="margin-bottom:12px">Delete Recipe?</h3>';
  h+='<p style="color:#666;font-size:14px;margin-bottom:20px">Are you sure you want to delete <strong>'+name+'</strong>? This cannot be undone.</p>';
  h+='<div style="display:flex;gap:10px"><button class="btn-sec" style="flex:1" onclick="document.getElementById(\'confirm-overlay\').remove()">Cancel</button>';
  h+='<button class="btn" style="flex:1;background:#e74c3c;box-shadow:0 2px 8px rgba(231,76,60,.25)" onclick="doDeleteRecipe('+id+')">Delete</button></div></div>';
  overlay.innerHTML=h;document.body.appendChild(overlay);
}
function doDeleteRecipe(id){
  // also fix selMeals if deleted recipe was selected
  var oldIdx=-1;for(var i=0;i<recipes.length;i++){if(recipes[i].id===id){oldIdx=i;break}}
  recipes=recipes.filter(function(r){return r.id!==id});
  sv("p_rec",recipes);
  // fix selMeals indices
  selMeals=selMeals.map(function(s){if(s===oldIdx)return -1;if(s>oldIdx)return s-1;return s});
  if(selMeals[0]<0||selMeals[0]>=recipes.length)selMeals[0]=0;
  if(selMeals[1]<0||selMeals[1]>=recipes.length)selMeals[1]=Math.min(1,recipes.length-1);
  sv("p_meals",selMeals);
  var el=document.getElementById("confirm-overlay");if(el)el.remove();
  render();
}
function selectRecipeForWeek(idx){
  var m1=recipes[selMeals[0]];var m2=recipes[selMeals[1]];
  // If already selected, skip
  if(selMeals[0]===idx||selMeals[1]===idx){return}
  var overlay=document.createElement("div");overlay.className="overlay";overlay.id="confirm-overlay";
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove()};
  var h='<div class="modal" style="max-width:340px;text-align:center">';
  h+='<h3 style="margin-bottom:12px">Replace Which Meal?</h3>';
  h+='<p style="color:#666;font-size:13px;margin-bottom:16px">Choose which slot to replace with <strong>'+esc(recipes[idx].name)+'</strong></p>';
  h+='<div style="display:grid;gap:10px">';
  h+='<button class="btn-sec" style="padding:14px;font-size:14px" onclick="doSelectRecipe('+idx+',0)">Replace Meal 1: '+(m1?esc(m1.name):"Empty")+'</button>';
  h+='<button class="btn-sec" style="padding:14px;font-size:14px" onclick="doSelectRecipe('+idx+',1)">Replace Meal 2: '+(m2?esc(m2.name):"Empty")+'</button>';
  h+='<button style="background:0;border:0;color:#888;font-size:13px;cursor:pointer;padding:8px" onclick="document.getElementById(\'confirm-overlay\').remove()">Cancel</button>';
  h+='</div></div>';
  overlay.innerHTML=h;document.body.appendChild(overlay);
}
function doSelectRecipe(idx,slot){
  selMeals[slot]=idx;
  sv("p_meals",selMeals);checkedItems={};
  var el=document.getElementById("confirm-overlay");if(el)el.remove();
  render();
}
function updateCheckIn(id,val){checkInUpdates[id]=val}
function resetCheckin(){checkInDone=false;checkInUpdates={};render()}
function submitCheckin(){
  var ws=wkStr();inventory=inventory.map(function(item){
    if(checkInUpdates[item.id]!=null&&checkInUpdates[item.id]!=="")return Object.assign({},item,{levels:item.levels.concat([{week:ws,level:+checkInUpdates[item.id]}])});
    return Object.assign({},item,{levels:item.levels.concat([{week:ws,level:Math.round(proj(item))}])});
  });sv("p_inv",inventory);checkInDone=true;render();
}
function rerollMeals(){var sh=shuf(recipes.map(function(_,i){return i}));selMeals=[sh[0],sh[1]];sv("p_meals",selMeals);checkedItems={};render()}
function replaceMeal(slot){var other=selMeals[slot===0?1:0];var av=recipes.map(function(_,i){return i}).filter(function(i){return i!==other});selMeals[slot]=av[Math.floor(Math.random()*av.length)];sv("p_meals",selMeals);checkedItems={};render()}

/* ═══ ADD ITEM MODAL ═══ */
function showAddItem(){
  var overlay=document.createElement("div");overlay.className="overlay";overlay.id="modal-overlay";
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove()};
  var cats=["Food Staples","Fridge Sauces","Kitchen Items","Laundry Items","Cleaning Supplies","Bathroom"];
  var h='<div class="modal"><div class="hdr"><h3>Add Item</h3><button class="close" onclick="document.getElementById(\'modal-overlay\').remove()">✕</button></div>';
  h+='<div class="field"><label>Name</label><input id="ai-name" placeholder="e.g. Olive Oil"></div>';
  h+='<div class="field"><label>Category</label><select id="ai-cat">'+cats.map(function(c){return'<option>'+c+'</option>'}).join("")+'</select></div>';
  h+='<div class="row2"><div class="field"><label>Urgency</label><select id="ai-urg"><option value="1">1 — Low</option><option value="2" selected>2 — Medium</option><option value="3">3 — High</option><option value="4">4 — Critical</option></select></div>';
  h+='<div class="field"><label>Amount</label><input id="ai-amt" placeholder="1 bottle"></div></div>';
  h+='<div class="field"><label>Level: <span id="ai-lbl">100</span>%</label><input type="range" id="ai-lvl" min="0" max="100" step="5" value="100" oninput="document.getElementById(\'ai-lbl\').textContent=this.value" style="width:100%;accent-color:#2d6a4f"></div>';
  h+='<button class="btn" style="width:100%" onclick="addItem()">Add Item</button></div>';
  overlay.innerHTML=h;document.body.appendChild(overlay);
}
function addItem(){
  var name=document.getElementById("ai-name").value.trim();var amt=document.getElementById("ai-amt").value.trim();
  if(!name||!amt)return;
  var maxId=0;inventory.forEach(function(i){if(i.id>maxId)maxId=i.id});
  inventory.push({id:maxId+1,name:name,category:document.getElementById("ai-cat").value,urgency:+document.getElementById("ai-urg").value,amount:amt,levels:[{week:wkStr(),level:+document.getElementById("ai-lvl").value}]});
  sv("p_inv",inventory);document.getElementById("modal-overlay").remove();render();
}

/* ═══ ADD RECIPE MODAL ═══ */
var arParsed=[];
function showAddRecipe(){
  arParsed=[];
  var overlay=document.createElement("div");overlay.className="overlay";overlay.id="modal-overlay";
  overlay.onclick=function(e){if(e.target===overlay)overlay.remove()};
  var h='<div class="modal"><div class="hdr"><h3>Add Recipe</h3><button class="close" onclick="document.getElementById(\'modal-overlay\').remove()">✕</button></div>';
  h+='<div class="field"><label>Name</label><input id="ar-name" placeholder="Chicken Alfredo"></div>';
  h+='<div class="row3"><div class="field"><label>Type</label><select id="ar-cat"><option>Handhelds</option><option>Healthy</option><option selected>Bowls</option><option>Off Menu</option></select></div>';
  h+='<div class="field"><label>Cost</label><select id="ar-cost"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>';
  h+='<div class="field"><label>Prep</label><input id="ar-time" value="3 hours"></div></div>';
  h+='<div class="field"><label>Ingredients (one per line)</label><textarea id="ar-ing" placeholder="Chicken Breast (2)\nBell Peppers (3)"></textarea></div>';
  h+='<div id="ar-cats"></div>';
  h+='<button class="btn-sec" style="width:100%;margin-bottom:12px" onclick="categorizeIngredients()">Categorize Ingredients</button>';
  h+='<div class="field"><label>Steps (one per line)</label><textarea id="ar-steps" placeholder="Season chicken\nSear in pan"></textarea></div>';
  h+='<button class="btn" style="width:100%" onclick="addRecipe()">Add Recipe</button></div>';
  overlay.innerHTML=h;document.body.appendChild(overlay);
}
function categorizeIngredients(){
  var lines=document.getElementById("ar-ing").value.split("\n").filter(function(l){return l.trim()});
  arParsed=lines.map(function(l){return{name:l.trim(),qty:"",groceryCat:"other"}});
  var gc=["meat","vegetable","starch","fruit","other"];
  var h='<div style="background:#fafaf8;border-radius:10px;padding:12px;margin-bottom:12px">';
  arParsed.forEach(function(ing,i){
    h+='<div class="cat-row"><span>'+esc(ing.name)+'</span><select onchange="arParsed['+i+'].groceryCat=this.value">';
    gc.forEach(function(g){h+='<option value="'+g+'">'+g[0].toUpperCase()+g.slice(1)+'</option>'});
    h+='</select></div>';
  });
  h+='</div>';document.getElementById("ar-cats").innerHTML=h;
}
function addRecipe(){
  var name=document.getElementById("ar-name").value.trim();
  if(!name||arParsed.length===0){alert("Enter name and categorize ingredients first");return}
  var maxId=0;recipes.forEach(function(r){if(r.id>maxId)maxId=r.id});
  var steps=document.getElementById("ar-steps").value.split("\n").filter(function(l){return l.trim()});
  recipes.push({id:maxId+1,name:name,category:document.getElementById("ar-cat").value,cost:+document.getElementById("ar-cost").value,time:document.getElementById("ar-time").value,ingredients:arParsed.slice(),steps:steps});
  sv("p_rec",recipes);document.getElementById("modal-overlay").remove();render();
}

/* ═══ TAB NAVIGATION ═══ */
document.getElementById("tabs").addEventListener("click",function(e){
  var btn=e.target.closest("button");if(!btn)return;
  curPage=btn.dataset.page;render();
});

/* ═══ INIT ═══ */
render();
</script>
