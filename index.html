<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pantry">
<meta name="theme-color" content="#2d6a4f">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Sam and Molly's Pantry</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(160deg,#f5f0eb,#eae4dd,#e8e2d9);color:#333;min-height:100vh;padding-bottom:72px}
h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;color:#1a1a2e}
.container{max-width:600px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0 12px;border-bottom:1px solid #d4c9bc}
header h1{font-size:26px;letter-spacing:-.5px}
header p{font-size:12px;color:#888;margin-top:2px}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;vertical-align:middle}
.sync-dot.on{background:#27ae60}.sync-dot.off{background:#e74c3c}.sync-dot.load{background:#f39c12}
main{padding:20px 0;min-height:60vh}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #e0dbd4;padding-bottom:env(safe-area-inset-bottom);z-index:100}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;border:none;background:0;cursor:pointer;color:#999;font-family:'DM Sans',sans-serif;font-weight:500;font-size:10px}
nav button.active{color:#2d6a4f;font-weight:700}
nav button span.icon{font-size:22px;display:block}
nav button span.lbl{margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:10px;padding:14px 12px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:3px solid #2d6a4f}
.stat.red{border-left-color:#e74c3c}
.stat-label{font-size:10px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.stat-val{font-size:22px;font-weight:700;color:#1a1a2e;margin-top:2px;font-family:'DM Serif Display',Georgia,serif}
.stat.red .stat-val{color:#e74c3c}
.btn{padding:12px 24px;background:#2d6a4f;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;box-shadow:0 2px 8px rgba(45,106,79,.25)}
.btn-sm{padding:10px 16px;font-size:14px}
.btn-sec{padding:8px 14px;background:#fff;color:#2d6a4f;border:1px solid rgba(45,106,79,.27);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-icon{background:none;border:1px solid #ddd;border-radius:6px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0;color:#888}
.chips{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.chip{padding:5px 12px;border:1px solid #ccc;border-radius:16px;background:#fff;cursor:pointer;font-size:11px;font-weight:500;font-family:'DM Sans',sans-serif;color:#666;white-space:nowrap}
.chip.on{background:#2d6a4f;color:#fff;border-color:#2d6a4f}
.tbl-wrap{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#fafaf8;border-bottom:1px solid #eee;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#888;cursor:pointer;user-select:none}
td{padding:8px 12px;border-bottom:1px solid #f5f5f3}
.low-bg{background:rgba(231,76,60,.06)}
.low-badge{margin-left:6px;padding:1px 5px;background:rgba(231,76,60,.09);color:#e74c3c;font-size:9px;font-weight:700;border-radius:3px}
.urg{padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600}
.bar-bg{flex:1;height:6px;background:#eee;border-radius:3px;overflow:hidden;max-width:80px}
.bar-fill{height:100%;border-radius:3px;transition:width .3s}
.section-hdr{font-family:'DM Serif Display',Georgia,serif;font-size:16px;color:#1a1a2e;padding:8px 0 6px;border-bottom:1px solid #e0dbd4;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.section-hdr.red{color:#e74c3c}
.list-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:14px}
.list-item.done{opacity:.45;text-decoration:line-through}
.list-item.recipe-bg{background:#f0faf5}
.list-item.restock-bg{background:#fef2f2}
.cb{width:22px;height:22px;border-radius:6px;border:2px solid #ccc;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.cb.on{background:#2d6a4f;border-color:#2d6a4f;color:#fff;font-size:11px}
.cb.red.on{background:#e74c3c;border-color:#e74c3c}
.badge{font-size:9px;font-weight:700;text-transform:uppercase;color:#2d6a4f}
.meal-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.meal-card{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-top:3px solid #2d6a4f;position:relative}
.meal-card .close{position:absolute;top:8px;right:10px;background:0;border:0;cursor:pointer;font-size:14px;color:#ccc}
.meal-card .tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#2d6a4f;margin-bottom:4px}
.meal-card h3{font-size:16px;margin-bottom:2px}
.meal-card .meta{font-size:11px;color:#888}
.recipe-card{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:10px;border-top:3px solid #e0dbd4}
.recipe-card.hl{border-top-color:#2d6a4f}
.recipe-card .top{display:flex;justify-content:space-between;align-items:start}
.recipe-card .close{background:0;border:0;cursor:pointer;font-size:16px;color:#ccc;padding:4px}
.recipe-card .wk{font-size:10px;font-weight:700;color:#2d6a4f;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.recipe-card h3{font-size:18px;cursor:pointer}
.recipe-card .meta{font-size:12px;color:#888;margin-top:2px}
.recipe-card .detail{margin-top:12px}
.recipe-card .detail .lbl{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;margin-bottom:6px}
.recipe-card .pills{display:flex;flex-wrap:wrap;gap:5px}
.recipe-card .pill{padding:3px 8px;background:#f5f0eb;border-radius:5px;font-size:12px;color:#555}
.recipe-card ol{margin:0;padding-left:16px;font-size:13px;color:#555;line-height:1.7}
.update-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:8px}
.update-row .info{flex:1;min-width:0}
.update-row .nm{font-weight:600;font-size:14px;color:#1a1a2e}
.update-row .amt{font-size:11px;color:#999}
.update-row .right{display:flex;align-items:center;gap:10px}
.update-row input{width:60px;text-align:center;font-size:15px;font-weight:700;padding:6px;border:1px solid #ddd;border-radius:8px;font-family:'DM Sans',sans-serif}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal{background:#fff;border-radius:14px;padding:20px 24px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal h3{font-size:20px;margin:0;color:#1a1a2e}
.modal .close{background:0;border:0;font-size:22px;cursor:pointer;color:#999;padding:4px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;outline:none}
.field textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cat-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cat-row span{flex:1;font-size:13px}
.cat-row select{width:110px;padding:6px 8px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif}
.center{text-align:center;padding:50px 0}
.center .big{font-size:48px;margin-bottom:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.add-row{display:flex;gap:8px;padding:6px 12px}
.add-row input{flex:1;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif}
.add-row button{padding:8px 14px;background:#2d6a4f;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <header>
    <div><h1>Sam &amp; Molly's Pantry</h1><p>Inventory · Recipes · Grocery <span id="sync-dot" class="sync-dot off"></span></p></div>
  </header>
  <main id="main"></main>
</div>
<nav id="tabs">
  <button data-page="inventory" class="active"><span class="icon">📦</span><span class="lbl">Pantry</span></button>
  <button data-page="checkin"><span class="icon">📋</span><span class="lbl">Check-in</span></button>
  <button data-page="recipes"><span class="icon">👨‍🍳</span><span class="lbl">Recipes</span></button>
  <button data-page="grocery"><span class="icon">🛒</span><span class="lbl">List</span></button>
</nav>
<script src="./app.js"></script>
<script>
// Register SW with auto-update: always check for new version on load
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(function(reg) {
    // Check for update every time the page loads
    reg.update();
    // When a new SW is found, activate it immediately
    reg.addEventListener('updatefound', function() {
      var newSW = reg.installing;
      newSW.addEventListener('statechange', function() {
        if (newSW.state === 'activated') {
          window.location.reload();
        }
      });
    });
  });
}
</script>
</body>
</html>
